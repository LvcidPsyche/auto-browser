[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-browser-langchain"
version = "1.4.2"
description = "LangChain / LangGraph / CrewAI integration for auto-browser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]
keywords = ["auto-browser", "langchain", "langgraph", "crewai", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.28"]
# langchain-core is pinned rather than floated: the tests need it installed to
# exercise AutoBrowserTool at all, and 1.5.0 was the newest release older than
# the 72-hour supply-chain window when this suite was added. Bump deliberately.
dev = ["pytest", "pytest-cov", "respx", "langchain-core==1.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/LvcidPsyche/auto-browser"
Repository = "https://github.com/LvcidPsyche/auto-browser"
Changelog = "https://github.com/LvcidPsyche/auto-browser/blob/main/CHANGELOG.md"
Issues = "https://github.com/LvcidPsyche/auto-browser/issues"
