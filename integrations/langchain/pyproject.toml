[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-browser-langchain"
version = "1.6.0"
description = "LangChain / LangGraph / CrewAI integration for auto-browser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]
keywords = ["auto-browser", "langchain", "langgraph", "crewai", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.28"]
# dev pulls the langchain extra rather than naming langchain-core again, so the
# version constraint has exactly one home. Floated deliberately: this package's
# whole job is to sit on top of langchain-core, so testing against whatever is
# current is how upstream breakage gets caught rather than discovered by users.
dev = ["auto-browser-langchain[langchain]", "pytest", "pytest-cov", "respx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/LvcidPsyche/auto-browser"
Repository = "https://github.com/LvcidPsyche/auto-browser"
Changelog = "https://github.com/LvcidPsyche/auto-browser/blob/main/CHANGELOG.md"
Issues = "https://github.com/LvcidPsyche/auto-browser/issues"
