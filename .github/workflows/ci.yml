name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install lint tools
        # Single-source the ruff pin from controller/requirements-dev.txt. Hardcoding it
        # here let the CI gate drift 9 patch versions behind the pin Dependabot maintains,
        # so lint could pass in CI and fail locally (or vice versa).
        run: python -m pip install "$(grep -E '^ruff==' controller/requirements-dev.txt)"
      - name: Ruff check
        run: make lint
      - name: Check Playwright pins matched (controller <-> browser-node)
        run: python scripts/check_playwright_pins.py
      - name: Check version strings matched across packages
        run: python scripts/check_version_parity.py
      - name: Check bump_version.py still finds every version field
        # A no-op bump to the current version must leave the tree unchanged; if a field moved,
        # the script exits non-zero or rewrites something and the diff check fails.
        run: |
          CURRENT=$(python -c "import tomllib; print(tomllib.load(open('client/pyproject.toml','rb'))['project']['version'])")
          python scripts/bump_version.py "$CURRENT"
          git diff --exit-code
      - name: Check stdio bridge copies matched (client <-> controller)
        run: python scripts/check_bridge_parity.py
      - name: Validate agent eval matrix
        run: python scripts/agent_eval.py --mock --json --report-file /tmp/agent-evals.md
      - name: Validate fixture eval matrix
        run: python scripts/fixture_eval.py

  host-tests:
    timeout-minutes: 45
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host test dependencies
        run: python -m pip install -e ./controller[dev]
      # The real-Chromium tests (page text, element naming, overlays, TOTP, the
      # dashboard) skip when no browser is installed, and until now none was, so
      # they never ran in CI. One leg is enough: they test the page, not Python.
      - name: Install Chromium for the real-browser tests
        if: matrix.python-version == '3.11'
        run: python -m playwright install --with-deps chromium
      - name: Run controller tests on host Python
        # The leg that installed Chromium must run its tests: with this set, a missing
        # browser fails the run instead of skipping the real-browser tests.
        env:
          AUTO_BROWSER_REQUIRE_CHROMIUM: ${{ matrix.python-version == '3.11' && '1' || '' }}
        run: |
          cd controller
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

  langchain-tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is in the matrix deliberately: the sync _run path was broken there
        # (asyncio.get_event_loop() raises since 3.14) while the package metadata
        # advertised support, and nothing tested it.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install langchain integration test dependencies
        run: python -m pip install -e './integrations/langchain[langchain,dev]'
      - name: Run langchain integration tests
        run: |
          cd integrations/langchain
          python -m pytest tests -q \
            --cov=auto_browser_langchain \
            --cov-report=term-missing \
            --cov-fail-under=90

  client-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install client test dependencies
        run: python -m pip install -e ./client[dev]
      - name: Run direct client tests
        # The client SDK is published to PyPI and measured 90% when this gate was
        # added; 85% leaves headroom while stopping a silent slide. The controller
        # has had an 80% gate for releases — the SDK users actually install had none.
        run: |
          cd client
          PYTHONPATH=. python -m pytest tests -q \
            --cov=auto_browser_client \
            --cov-report=term-missing \
            --cov-fail-under=85

  dependency-audit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-node/package-lock.json
      - name: Install Python audit tool
        run: python -m pip install pip-audit
      - name: Audit Python runtime dependencies
        run: python -m pip_audit -r controller/requirements.txt
      - name: Install browser-node dependencies from lockfile
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: browser-node
      - name: Audit browser-node production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: browser-node
      - name: Test browser-node's sandbox policy (BROWSER_SANDBOX)
        # Node's built-in runner; sandbox.mjs imports only node: modules.
        run: node --test sandbox.test.mjs
        working-directory: browser-node

  package-build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install build
      - name: Build Python wheels
        run: |
          python -m build --wheel --outdir /tmp/wheelhouse controller
          python -m build --wheel --outdir /tmp/wheelhouse client
          python -m build --wheel --outdir /tmp/wheelhouse integrations/langchain
          python -m build --wheel --outdir /tmp/wheelhouse packaging/auto-browser-mcp
      - name: The controller wheel ships the seccomp profile
        # app/browser_sandbox.py loads it from the package; setuptools ships only .py files unless told.
        run: |
          python -m zipfile -l /tmp/wheelhouse/auto_browser_controller-*.whl | tee /tmp/controller-wheel.txt
          for name in chromium-sandbox.json moby-default.json; do
            grep -q "app/browser/seccomp/$name" /tmp/controller-wheel.txt || { echo "the controller wheel lacks app/browser/seccomp/$name" >&2; exit 1; }
          done

  controller-tests:
    timeout-minutes: 20
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker compose config
        run: |
          docker compose -f docker-compose.yml config >/tmp/compose-main.out
          docker compose -f docker-compose.yml -f docker-compose.isolation.yml config >/tmp/compose-isolation.out

      - name: Build controller image
        # With the test tooling, which the image leaves out by default.
        run: INSTALL_DEV_DEPS=true docker compose build controller

      - name: Run controller unit tests
        # pytest, not `unittest discover`. unittest only collects unittest.TestCase
        # subclasses, so it silently ran 566 of 637 tests -- skipping test_1_0.py
        # (61: mesh Ed25519 identity/signing, peer registry, delegation policy,
        # stealth, network inspector, CDP, workflow engine), test_pii_scrub.py (8)
        # and test_readiness.py (4) because they are pytest-style. The one job that
        # validates the shipped container was running zero PII and zero mesh-crypto
        # tests, and any new pytest-style file was excluded with no warning.
        # The build above sets INSTALL_DEV_DEPS=true, so pytest is present.
        run: docker compose run --no-deps --rm controller python -m pytest tests/ -q

      - name: Run the root step's tests as root in the image
        # The suite above runs as the owner of ./data (the runner), so the tests that hand other uids' files over
        # (real chown, the 10001 -> 10002 upgrade) skip there. Here they run as root, past the entrypoint.
        # It must really be root, or the root-only tests skip and the step stays green.
        run: >-
          docker compose run --no-deps --rm --entrypoint sh controller -c
          'test "$(id -u)" = 0 || { echo "not root: uid $(id -u)" >&2; exit 1; };
          python -m pytest tests/test_run_as.py tests/test_drop_caps.py -q -rs'

      - name: The marker child writes as the user when root holds no DAC capability
        # The real fork child, as root with CAP_DAC_OVERRIDE and CAP_DAC_READ_SEARCH out of the bounding set: the exec'd
        # root process takes the bounding set, so its effective set lacks both (setpriv cannot lower the current
        # process's effective set, but the next one's is bounded). The guard proves it before the tests run and puts
        # the CapEff in the log; the test is named by its node id, so a rename fails the step (pytest exits 4).
        run: >-
          docker compose run --no-deps --rm --entrypoint setpriv controller
          --inh-caps=-all --bounding-set=-dac_override,-dac_read_search sh -c
          'test "$(id -u)" = 0 || { echo "not root" >&2; exit 1; };
          eff=$(awk "/^CapEff:/ {print \$2}" /proc/self/status);
          [ $(( (0x$eff >> 1) & 3 )) -eq 0 ] || { echo "CapEff $eff still has DAC_OVERRIDE or DAC_READ_SEARCH" >&2; exit 1; };
          echo "uid 0, CapEff $eff";
          python -m pytest tests/test_run_as.py::MainLinuxTests::test_as_root_a_pre_release_data_dir_owned_by_10001_goes_to_10002 -q -rs'

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [host-tests, client-tests, langchain-tests, dependency-audit, package-build, controller-tests]
    timeout-minutes: 25
    env:
      # A fixed, CI-only password: it guards nothing real. With it set, both browser-node
      # VNC checks require VNC authentication (--expect-password) and the isolated
      # smoke's browser-node probe is strict, which is the setup operators are told to
      # run; without it CI only ever proved a password-less noVNC.
      VNC_PASSWORD: ci-smoke-vnc
    steps:
      - uses: actions/checkout@v7

      - name: Run doctor smoke test
        run: DOCTOR_BUILD=1 ./scripts/doctor.sh

      - name: Report Chromium's sandbox in browser-node
        # What this runner's kernel and AppArmor allow: BROWSER_SANDBOX=auto runs Chromium sandboxed where it can and
        # otherwise falls back with the cause in the state file (Ubuntu 24.04 restricts unprivileged user namespaces
        # with AppArmor). Printed, not asserted, so a fallback keeps the job green and stays visible.
        run: docker compose exec -T -u browser browser-node node /opt/browser-node/sandbox-report.mjs browser-node

      - name: Check the controller demands its generated token
        # With no API_BEARER_TOKEN, the loopback controller generates a token in
        # data/api-token and demands it. Before, any container on the compose
        # network reached it tokenless by sending Host: localhost. The file must
        # also belong to the runner (0600), or the host user, the scripts and the
        # stdio bridge could not read it.
        run: |
          api_port="$(docker compose port controller 8000 | awk -F: 'NF {print $NF}' | tail -n1)"
          : "${api_port:?controller publishes no host port for the API (8000)}"
          from_host="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${api_port}/sessions")"
          if [ "$from_host" != "401" ]; then
            echo "A tokenless /sessions from the host answered $from_host, not 401" >&2
            exit 1
          fi
          from_network="$(docker compose exec -T browser-node curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://controller:8000/sessions)"
          if [ "$from_network" != "401" ]; then
            echo "browser-node with a forged Host: localhost answered $from_network, not 401" >&2
            exit 1
          fi
          token_file="$(stat -c '%a %U' data/api-token)"
          if [ "$token_file" != "600 runner" ]; then
            echo "data/api-token is '$token_file', not '600 runner'" >&2
            exit 1
          fi
          # The controller runs as the owner of ./data (the runner here), never root, so the
          # runner keeps its files and its token (controller/entrypoint.sh, app/run_as.py).
          data_owner="$(stat -c '%u' data)"
          controller_uid="$(docker compose exec -T controller awk '/^Uid:/ {print $2}' /proc/1/status)"
          echo "controller uid $controller_uid, ./data owner $data_owner"
          if [ "$controller_uid" != "$data_owner" ] || [ "$controller_uid" = "0" ]; then
            echo "the controller runs as uid $controller_uid, not as the owner of ./data ($data_owner)" >&2
            exit 1
          fi
          # setpriv leaves it no capability in any set, and no_new_privs.
          status="$(docker compose exec -T controller grep -E '^(CapInh|CapPrm|CapEff|CapBnd|CapAmb|NoNewPrivs):' /proc/1/status)"
          echo "$status"
          if [ "$(echo "$status" | grep -c .)" != 6 ]; then
            echo "expected 6 capability/no_new_privs lines in the controller's /proc/1/status" >&2
            exit 1
          fi
          if ! echo "$status" | awk '/^Cap/ && $2 != "0000000000000000" {bad=1} /^NoNewPrivs/ && $2 != "1" {bad=1} END {exit bad}'; then
            echo "the controller kept a capability or runs without no_new_privs" >&2
            exit 1
          fi

      - name: A download reaches the controller
        # The controller runs as the runner's uid here, not browser-node's 10001: a real Chromium download must
        # still be captured and read back by it.
        run: python3 scripts/smoke_download.py

      - name: Check browser-node serves VNC only through noVNC
        # x11vnc listened on TCP 5900, where libvncserver takes a WebSocket from any
        # Origin, right beside noVNC's Origin guard. Fails on any RFB TCP listener
        # and proves takeover through noVNC still reaches the display. doctor moves noVNC
        # off 6080 when that port is busy, so the published port is read back here.
        run: |
          novnc_port="$(docker compose port browser-node 6080 | awk -F: 'NF {print $NF}' | tail -n1)"
          : "${novnc_port:?browser-node publishes no host port for noVNC (6080)}"
          python3 scripts/check_vnc_exposure.py "$(docker compose ps -q browser-node)" "$novnc_port" \
            ${VNC_PASSWORD:+--expect-password}

      - name: Restart browser-node and check VNC again
        # A restart runs entrypoint.sh over an existing profile dir: it removes
        # the endpoint file there as root, which needs DAC_OVERRIDE under the
        # dropped capability set. A fresh start never takes that path.
        run: |
          docker compose restart browser-node
          container="$(docker compose ps -q browser-node)"
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
            [ "$status" = healthy ] && break
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "browser-node is $status after restart" >&2
            docker compose logs --tail 50 browser-node >&2
            exit 1
          fi
          novnc_port="$(docker compose port browser-node 6080 | awk -F: 'NF {print $NF}' | tail -n1)"
          : "${novnc_port:?browser-node publishes no host port for noVNC (6080)}"
          python3 scripts/check_vnc_exposure.py "$container" "$novnc_port" \
            ${VNC_PASSWORD:+--expect-password}

      - name: Run isolated session smoke test
        # The smoke runs in its own compose project unless told otherwise. The doctor step's stack is the
        # default project, named after the checkout folder: keep that name so the smoke tears it down, as before.
        env:
          COMPOSE_PROJECT_NAME: auto-browser
        run: DOCTOR_BUILD=1 API_PORT=8010 ./scripts/smoke_isolated_session.sh

      - name: Chromium's sandbox engages and is verified (BROWSER_SANDBOX=on)
        # The step above only prints the state, since Ubuntu 24.04's AppArmor refuses unprivileged user namespaces
        # and auto falls back. Here that restriction is lifted and on is required: browser-node must start with the
        # sandbox on, setting on, and /proc evidence (verified renderers in their own user namespace, one more seccomp
        # filter each), or the job fails. The controller runs under on too: it must take that browser-node's state
        # (naming the endpoint it connected to) as a verified on and run a session on it.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          BROWSER_SANDBOX=on docker compose up -d --force-recreate browser-node controller
          container="$(docker compose ps -q browser-node)"
          for _ in $(seq 1 60); do
            [ -s data/browser-profile/browser-sandbox.json ] && [ -s data/browser-profile/browser-ws-endpoint.txt ] && break
            [ "$(docker inspect -f '{{.State.Status}}' "$container")" = running ] || break
            sleep 2
          done
          docker compose logs --tail 20 browser-node
          python3 scripts/assert_browser_sandbox.py data/browser-profile/browser-sandbox.json --require-proc
          api_port="$(docker compose port controller 8000 | awk -F: 'NF {print $NF}' | tail -n1)"
          python3 scripts/check_sandbox_gate.py --expect 200 --api-port "$api_port"

      - name: Without the profile, BROWSER_SANDBOX=on refuses to start
        # The negative leg: under Docker's own profile a sandboxed launch cannot start, so on must leave browser-node
        # refused, with its state saying so and no endpoint: the session is refused by the gate, or by a failed
        # connect to a browser-node that refused to start (the next step is the one only the gate can refuse).
        run: |
          BROWSER_SANDBOX=on BROWSER_SECCOMP_PROFILE=builtin docker compose up -d --force-recreate --no-deps browser-node || true
          python3 - <<'PY'
          import json, pathlib, sys, time
          # The container restarts (restart: unless-stopped) and rewrites the file each time: poll for the refusal.
          state_file = pathlib.Path("data/browser-profile/browser-sandbox.json")
          state = None
          for _ in range(120):
              try:
                  state = json.loads(state_file.read_text())
              except (OSError, ValueError):
                  state = None
              if state and state.get("sandbox") == "refused":
                  break
              time.sleep(1)
          print(state)
          if not state or state.get("sandbox") != "refused" or state.get("setting") != "on":
              sys.exit(f"expected a refusal under on without the profile, got {state}")
          if pathlib.Path("data/browser-profile/browser-ws-endpoint.txt").exists():
              sys.exit("a refused browser-node left an endpoint file")
          print("OK: refused, no endpoint")
          PY
          docker compose logs --tail 20 browser-node
          api_port="$(docker compose port controller 8000 | awk -F: 'NF {print $NF}' | tail -n1)"
          python3 scripts/check_sandbox_gate.py --expect 409 --api-port "$api_port"

      - name: The controller's gate refuses an unverified browser-node (BROWSER_SANDBOX=on)
        # The leg above's 409 comes from a browser-node with no endpoint at all. Here browser-node runs under auto with
        # Docker's own profile: it starts unsandboxed (state off) and publishes an endpoint, so the controller (still
        # under on) connects, and only its gate can refuse the session; its WARNING must say why.
        run: |
          BROWSER_SANDBOX=auto BROWSER_SECCOMP_PROFILE=builtin docker compose up -d --force-recreate --no-deps browser-node
          for _ in $(seq 1 60); do
            [ -s data/browser-profile/browser-ws-endpoint.txt ] && break
            sleep 2
          done
          [ -s data/browser-profile/browser-ws-endpoint.txt ] || { echo "browser-node published no endpoint under auto" >&2; exit 1; }
          python3 -c 'import json,sys; s=json.load(open("data/browser-profile/browser-sandbox.json")); print(s); sys.exit(s.get("sandbox") != "off")'
          api_port="$(docker compose port controller 8000 | awk -F: 'NF {print $NF}' | tail -n1)"
          python3 scripts/check_sandbox_gate.py --expect 409 --api-port "$api_port" \
            --log-must-say "BROWSER_SANDBOX=on, but the shared browser-node reports off"

      - name: An isolated session under BROWSER_SANDBOX=on runs sandboxed
        # docker_ephemeral with the restriction lifted (the on-leg above): the session's own container must start
        # with a verified sandbox, /proc evidence included.
        run: |
          BROWSER_SANDBOX=on docker compose -f docker-compose.yml -f docker-compose.isolation.yml up -d --build --force-recreate browser-node controller
          api_port="$(docker compose -f docker-compose.yml -f docker-compose.isolation.yml port controller 8000 | awk -F: 'NF {print $NF}' | tail -n1)"
          python3 scripts/check_sandbox_gate.py --expect 200 --isolated --api-port "$api_port"
