name: Release

# Tag-triggered publish: build wheels/sdists for the PyPI packages, publish
# via PyPI trusted publishing (OIDC — no tokens stored anywhere), then create
# the GitHub release with CHANGELOG notes and the artifacts attached.
#
# Each package publishes from its own GitHub environment because PyPI's
# pending-publisher uniqueness constraint is on (owner, repo, workflow,
# environment) WITHOUT the project name — a second pending publisher on the
# same tuple 500s (pypi/warehouse#20006, #20112). Distinct environments give
# each package its own slot.
#
# PyPI setup (one-time, per package): pypi.org → Publishing → add publisher
# with owner LvcidPsyche, repo auto-browser, workflow release.yml, and:
#   auto-browser-client    → environment pypi
#   auto-browser-langchain → environment pypi-langchain
#   auto-browser-mcp       → environment pypi-mcp

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A v* tag on any commit used to publish it: a branch nobody merged, or a
  # commit whose CI never ran. Nothing builds or publishes unless the tagged
  # commit is on main AND the push-to-main run of ci.yml for that exact SHA
  # succeeded. The push run is the one that counts: a PR run's SHA is the PR
  # head, and a rebase merge gives main new SHAs, so only the push run on main
  # names the commit being tagged. Uses the API, so no checkout is needed.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the tagged commit to be on main with green CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          rel=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$rel" != "identical" ] && [ "$rel" != "behind" ]; then
            echo "::error::$TAG points at $SHA, which is not on main (compare status: $rel)"
            exit 1
          fi
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=success&per_page=1" --jq .total_count)
          if [ "$green" -lt 1 ]; then
            echo "::error::$TAG points at $SHA, but ci.yml has no successful push run on main for that commit (still running, failed, or never ran)"
            exit 1
          fi
          echo "$TAG -> $SHA is on main with a successful ci.yml push run"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in client/pyproject.toml integrations/langchain/pyproject.toml packaging/auto-browser-mcp/pyproject.toml; do
            V=$(python -c "import tomllib; print(tomllib.load(open('$f','rb'))['project']['version'])")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$f declares version $V but the tag is $TAG"
              exit 1
            fi
          done
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --outdir dist client
          python -m build --outdir dist integrations/langchain
          python -m build --outdir dist packaging/auto-browser-mcp
          ls -l dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: auto-browser-client
            environment: pypi
            dist_glob: auto_browser_client-*
          - package: auto-browser-langchain
            environment: pypi-langchain
            dist_glob: auto_browser_langchain-*
          - package: auto-browser-mcp
            environment: pypi-mcp
            dist_glob: auto_browser_mcp-*
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: all-dist/
      - name: Select ${{ matrix.package }} distributions
        run: |
          mkdir -p dist
          cp all-dist/${{ matrix.dist_glob }} dist/
          ls -l dist/
      # Pinned by commit: this step holds the job's OIDC token, which PyPI
      # trusts to publish. A branch ref would run whatever it moved to next.
      - name: Publish ${{ matrix.package }} to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > /tmp/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading artifacts only."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md
          fi
