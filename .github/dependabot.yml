version: 2
updates:
  - package-ecosystem: pip
    directory: /controller
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    # The project's 72-hour rule: no version update is proposed for a release under three days old. That is
    # Dependabot's default, stated here so a change of default cannot undo it. Security updates are not held.
    cooldown:
      default-days: 3
    # One PR per week for minor/patch bumps: same-file pins conflict as soon as
    # one PR merges, forcing rebase+CI cycles for every remaining PR. Majors
    # stay individual so they get reviewed on their own.
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    # Playwright is upgraded by hand, on both sides at once. The server refuses
    # a client of another major.minor, both sides must run the same browser,
    # and the pip pin here and the npm pin in /browser-node are separate
    # ecosystems to Dependabot -- so it can only ever propose half the change.
    # A half of another minor is not a smaller upgrade, it is the #60 outage:
    # every docker compose up --build crash-looped on readiness. It has since
    # re-proposed the npm half (#97) and the pip half (#121), both of another
    # minor and caught by scripts/check_playwright_pins.py; a half that moves
    # only the patch fails its --installed check if it changes the browser.
    # The guard stays; this stops feeding it.
    ignore:
      - dependency-name: playwright

  - package-ecosystem: npm
    directory: /browser-node
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # the 72-hour rule, as the pip entry says
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Ignored for the same reason as the pip side above: coordinated manual
    # bump only, guarded by scripts/check_playwright_pins.py (the pins, and
    # with --installed the browser each side carries).
    ignore:
      - dependency-name: playwright

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # the 72-hour rule, as the pip entry says
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Each Dockerfile's FROM is pinned by digest, which without this entry would freeze the base image's security
  # patches: Dependabot proposes the tag's newer digest. It has the cooldown the other entries have (GitHub's docs
  # list docker as taking default-days, and say nothing of a digest-only update). One entry listing each Dockerfile
  # directory, which is also its build context; its pull requests stay one per directory.
  - package-ecosystem: docker
    directories:
      - /
      - /controller
      - /browser-node
      - /reverse-ssh
      - /smoke/bastion
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # the 72-hour rule, as the pip entry says
    ignore:
      # A newer digest of the pinned tag only: a new tag (python:3.11-slim to 3.14-slim) is a decision of its own.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
