[build-system]
# >=77 is required by the PEP 639 SPDX `license` string below, not incidental:
# the deprecated `license = { text = "MIT" }` table stops building after
# 2027-02-18, and SPDX expressions are only understood from 77.0.0 on.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-browser-client"
version = "1.7.0"
description = "Python client SDK and MCP stdio bridge for Auto Browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["auto-browser", "mcp", "browser-automation", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # No "License ::" classifier: PEP 639 requires backends to reject a License
    # classifier alongside an SPDX `license` expression. The expression is the
    # single source of truth.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Homepage = "https://github.com/LvcidPsyche/auto-browser"
Repository = "https://github.com/LvcidPsyche/auto-browser"
Changelog = "https://github.com/LvcidPsyche/auto-browser/blob/main/CHANGELOG.md"
Issues = "https://github.com/LvcidPsyche/auto-browser/issues"

[project.scripts]
auto-browser-mcp = "auto_browser_client.mcp_bridge:main"

[tool.setuptools.packages.find]
include = ["auto_browser_client*"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
