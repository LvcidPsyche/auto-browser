# Private, one-human-per-project pilot. Start only one project at a time until
# measured capacity and the separate phone-verification gate are ready.
# No ports are published: neither the API nor unauthenticated noVNC is ingress.
services:
  browser-node:
    profiles: [pilot]
    build:
      context: ../../browser-node
    init: true
    restart: "no"
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [tenant]
    healthcheck:
      test: [CMD-SHELL, 'test -s /data/profile/browser-ws-endpoint.txt && curl -s --max-time 3 -o /dev/null http://127.0.0.1:9223/ && curl -fsS --max-time 3 http://127.0.0.1:6080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    environment:
      BROWSER_WIDTH: "1280"
      BROWSER_HEIGHT: "800"
      BROWSER_WS_ENDPOINT_FILE: /data/profile/browser-ws-endpoint.txt
      PLAYWRIGHT_SERVER_HOST: 0.0.0.0
      PLAYWRIGHT_SERVER_PORT: "9223"
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: browser-node
    volumes:
      - type: bind
        source: ${TENANT_DATA_ROOT:?Provision an isolated data root}/browser-profile
        target: /data/profile
      - type: bind
        source: ${TENANT_DATA_ROOT:?Provision an isolated data root}/downloads
        target: /data/downloads

  controller:
    profiles: [pilot]
    build:
      context: ../../controller
    init: true
    restart: "no"
    stop_grace_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [tenant]
    depends_on:
      browser-node:
        condition: service_healthy
    environment:
      APP_ENV: production
      API_BIND_SCOPE: exposed
      API_BEARER_TOKEN: ""
      API_BEARER_TOKENS: ${TENANT_OPERATOR_ID:?Missing operator}:${TENANT_BEARER_TOKEN:?Missing bearer token}
      SHARE_TOKEN_SECRET: ${TENANT_SHARE_SECRET:?Missing share secret}
      AUTH_STATE_ENCRYPTION_KEY: ${TENANT_FERNET_KEY:?Missing encryption key}
      REQUIRE_AUTH_STATE_ENCRYPTION: "true"
      REQUIRE_OPERATOR_ID: "true"
      REQUEST_RATE_LIMIT_ENABLED: "true"
      CONTROLLER_ALLOWED_HOSTS: controller,localhost,127.0.0.1
      ALLOWED_HOSTS: ${TENANT_ALLOWED_HOSTS:?Choose permitted websites}
      MCP_ALLOWED_ORIGINS: ""
      SESSION_ISOLATION_MODE: shared_browser_node
      MAX_SESSIONS: "1"
      STATE_DB_PATH: /data/db/operator.db
      BROWSER_WS_ENDPOINT_FILE: /data/browser-profile/browser-ws-endpoint.txt
      TAKEOVER_URL: http://127.0.0.1:6080/vnc.html
      METRICS_ENABLED: "false"
      STEALTH_ENABLED: "false"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
    volumes:
      - type: bind
        source: ${TENANT_DATA_ROOT:?Provision an isolated data root}
        target: /data

networks:
  tenant: {}
