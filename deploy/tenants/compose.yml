# One stack per enrolled immutable user/tenant pair. The provisioner supplies
# only opaque deterministic names and private generated credentials. No service
# has a published port. browser-node and controller never join control.
services:
  browser-node:
    profiles: [tenant]
    build:
      context: ../../browser-node
    init: true
    restart: "no"
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4.0
    pids_limit: 256
    shm_size: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    networks: [tenant]
    healthcheck:
      # PERSISTENT_PROFILES_ENABLED=true skips the shared launchServer() boot
      # (and the ws-endpoint file it used to write) entirely -- browser-node
      # launches each named profile's own Chromium lazily, on the first
      # session that asks for it. The profile-control API's /healthz is up
      # unconditionally in both modes, so it is what proves this container is
      # actually ready; the legacy ws-endpoint-file check only applies when
      # persistent profiles are off (PERSISTENT_PROFILES_ENABLED=false
      # restores the exact original healthcheck).
      test: [CMD-SHELL, 'if [ "$$PERSISTENT_PROFILES_ENABLED" = "true" ]; then curl -fsS --max-time 3 http://127.0.0.1:9224/healthz >/dev/null; else test -s /data/browser-profile/browser-ws-endpoint.txt && curl -s --max-time 3 -o /dev/null http://127.0.0.1:9223/; fi && curl -fsS --max-time 3 http://127.0.0.1:6080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    environment:
      BROWSER_WIDTH: "1280"
      BROWSER_HEIGHT: "800"
      BROWSER_WS_ENDPOINT_FILE: /data/browser-profile/browser-ws-endpoint.txt
      PLAYWRIGHT_SERVER_HOST: 0.0.0.0
      PLAYWRIGHT_SERVER_PORT: "9223"
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: browser-node
      PROFILE_CONTROL_PORT: "9224"
      # Rollback: set to "false" (or delete the line) to get today's
      # fresh-context-per-Open behaviour back exactly -- see
      # controller/app/persistent_profiles.py and browser-node/server.mjs.
      PERSISTENT_PROFILES_ENABLED: "true"
      PERSISTENT_PROFILE_LOCALE: ar-EG
      PERSISTENT_PROFILE_TIMEZONE: Africa/Cairo
    volumes:
      - type: volume
        source: data
        target: /data

  controller:
    profiles: [tenant]
    build:
      context: ../../controller
    init: true
    restart: "no"
    stop_grace_period: 60s
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [tenant]
    depends_on:
      browser-node:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    environment:
      APP_ENV: production
      API_BIND_SCOPE: exposed
      API_BEARER_TOKEN: ""
      API_BEARER_TOKENS: ${TENANT_OPERATOR_ID:?Missing operator}:${TENANT_CONTROLLER_TOKEN:?Missing controller credential}
      SHARE_TOKEN_SECRET: ${TENANT_SHARE_SECRET:?Missing share secret}
      AUTH_STATE_ENCRYPTION_KEY: ${TENANT_FERNET_KEY:?Missing encryption key}
      REQUIRE_AUTH_STATE_ENCRYPTION: "true"
      REQUIRE_OPERATOR_ID: "true"
      # Screenshot capture through the virtual display costs ~33s per call here, while a
      # text observation costs ~0.4s -- and the owner watches the live noVNC view anyway,
      # so employees read pages as text by default.
      PERCEPTION_PRESET_DEFAULT: text
      # Every action takes a before/after screenshot, and with PII_SCRUB_SCREENSHOT on
      # each one is OCR'd before it lands: ~30s per screenshot, ~60s per click on this
      # host. The artifacts live in the single owner's private volume and he watches the
      # same pixels live in noVNC, so the scrub buys nothing here and costs everything.
      PII_SCRUB_SCREENSHOT: "false"
      OCR_ENABLED: "false"
      REQUEST_RATE_LIMIT_ENABLED: "true"
      # One stack serves exactly one owner, and opening the noVNC viewer alone pulls ~50
      # assets, each of which runs a guard call through here. The shipped 120/min budget
      # is a public-API default and just made the viewer fail to connect.
      REQUEST_RATE_LIMIT_REQUESTS: "20000"
      CONTROLLER_ALLOWED_HOSTS: controller,localhost,127.0.0.1
      ALLOWED_HOSTS: ${TENANT_ALLOWED_HOSTS:?Choose permitted websites}
      MCP_ALLOWED_ORIGINS: ""
      SESSION_ISOLATION_MODE: shared_browser_node
      MAX_SESSIONS: "1"
      STATE_DB_PATH: /data/db/operator.db
      BROWSER_WS_ENDPOINT_FILE: /data/browser-profile/browser-ws-endpoint.txt
      TAKEOVER_URL: http://127.0.0.1:6080/vnc.html
      METRICS_ENABLED: "false"
      # A persistent, headed Chromium profile is a real, consistent device --
      # STEALTH_ENABLED here only ever applies the safe subset
      # (PERSISTENT_STEALTH_INIT_SCRIPT: navigator.webdriver removal, nothing
      # that fights the profile's genuine fingerprint) whenever a session
      # opened one, which is the normal case below.
      STEALTH_ENABLED: "true"
      # Rollback: "false" (or delete the line) restores today's fresh-context-
      # per-Open behaviour exactly -- must match browser-node's own flag.
      PERSISTENT_PROFILES_ENABLED: "true"
      BROWSER_NODE_HOST: browser-node
      PROFILE_CONTROL_PORT: "9224"
      BROWSER_PROFILES_ROOT: /data/browser-profiles
      PERSISTENT_PROFILE_LOCALE: ar-EG
      PERSISTENT_PROFILE_TIMEZONE: Africa/Cairo
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
    volumes:
      - type: volume
        source: data
        target: /data

  approval-broker:
    profiles: [tenant]
    build:
      context: ../..
      dockerfile: approval_broker/Dockerfile
    init: true
    restart: "no"
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      controller:
        condition: service_started
    environment:
      BROKER_OWNER_TOKEN: ${BROKER_OWNER_TOKEN:?Missing portal owner credential}
      BROKER_AGENT_TOKENS: ${BROKER_AGENT_TOKENS:?Missing gateway agent credential}
      API_BEARER_TOKEN: ${TENANT_CONTROLLER_TOKEN:?Missing controller credential}
      BROKER_UPSTREAM_URL: http://controller:8000
      BROKER_TOTP_DB: /broker-state/totp.sqlite3
      BROKER_PORTAL_ASSERTION_PUBLIC_KEY: ${BROKER_PORTAL_ASSERTION_PUBLIC_KEY:?Missing portal assertion public key}
      BROKER_USER_ID: ${BROKER_USER_ID:?Missing immutable user identity}
      BROKER_TENANT_ID: ${BROKER_TENANT_ID:?Missing immutable tenant identity}
    volumes:
      - type: volume
        source: broker-state
        target: /broker-state
    networks:
      tenant: {}
      control:
        aliases: ["${TENANT_BROKER_ALIAS:?Missing broker control alias}"]

networks:
  tenant:
    external: true
    name: ${TENANT_PRIVATE_NETWORK:?Provision an isolated private network}
  control:
    external: true
    name: ${TENANT_CONTROL_NETWORK:?Provision the private control network}

volumes:
  data:
    external: true
    name: ${TENANT_DATA_VOLUME:?Provision an isolated data volume}
  broker-state:
    external: true
    name: ${TENANT_BROKER_VOLUME:?Provision an isolated broker volume}
