[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-browser-controller"
version = "1.11.1"
description = "Controller API for auto-browser"
# 3.11, not 3.10: CI tests 3.11 and 3.14, the Dockerfile pins python:3.11-slim,
# and the published packages were corrected to >=3.11 in 1.5.2. A floor nothing
# exercises is the same unbacked claim that shipped the 3.14 langchain bug.
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/LvcidPsyche/auto-browser"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ["requirements-dev.txt"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
# Matches the root ruff.toml and requires-python. These disagreeing (py310 here
# vs py311 at the root) meant the two byte-identical stdio-bridge copies were
# formatted under different targets and could have drifted apart silently.
target-version = "py311"

[tool.ruff.lint]
# Syntax errors, unused names, import sorting, and the flake8-bandit security rules (S).
# Every S hit that is deliberate is listed below with its reason. Nothing may pass
# `--select` on the command line: it replaces this list.
select = ["E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use throwaway passwords/tokens and fixed temp paths, and run
# fixed-argument subprocesses and local URLs.
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S108", "S110", "S310", "S603"]
# Humanized timing/jitter and user-agent choice: unpredictability for realism, not secrecy.
"app/browser/services/actions.py" = ["S311"]
"app/browser/services/element_actions.py" = ["S311"]
"app/stealth/*.py" = ["S311"]
"app/config.py" = ["S311"]
# 0.0.0.0 here is a value compared against or handed to the browser-node container, or listed
# as a local-only host; the controller does not bind a socket to it.
"app/runtime_policy.py" = ["S104"]
"app/session_isolation.py" = ["S104"]
"app/browser/services/remote_access.py" = ["S104"]
# urlopen on the base URL the operator configured for their own controller.
"app/mcp_stdio.py" = ["S310"]
"app/agent_eval.py" = ["S310"]
# A stored record or metadata file that cannot be parsed is skipped, not fatal.
"app/mcp_transport.py" = ["S112"]
"app/memory_manager.py" = ["S112"]
"app/session_tunnel.py" = ["S112"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
