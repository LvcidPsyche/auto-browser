services:
  controller:
    build:
      args:
        # This override exists to run the provider CLIs, so the image needs them.
        INSTALL_AGENT_CLIS: "true"
    environment:
      CLI_HOME: ${CLI_HOST_HOME:-/home/botuser}
    volumes:
      # CLI_HOME itself: an empty tmpfs that any uid can write (mode 1777, noexec, emptied at every start), so the
      # controller, which does not run as root here, can make each Codex call's directory there and the CLIs their other
      # state. Without it the container runtime makes this home root-owned 0755, as the parent of the mounts below,
      # and every Codex call fails. Never set CLI_HOST_HOME to /root: this would make root's home writable.
      - type: tmpfs
        target: ${CLI_HOST_HOME:-/home/botuser}
        tmpfs:
          size: 67108864  # 64 MiB
      - type: bind
        source: ${CLI_HOST_HOME:-/home/botuser}/.codex
        target: ${CLI_HOST_HOME:-/home/botuser}/.codex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLI_HOST_HOME:-/home/botuser}/.claude
        target: ${CLI_HOST_HOME:-/home/botuser}/.claude
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLI_HOST_HOME:-/home/botuser}/.claude.json
        target: ${CLI_HOST_HOME:-/home/botuser}/.claude.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLI_HOST_HOME:-/home/botuser}/.gemini
        target: ${CLI_HOST_HOME:-/home/botuser}/.gemini
        read_only: true
        bind:
          create_host_path: false
